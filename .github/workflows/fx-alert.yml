name: FX USDJPY 15m Alert

on:
  schedule:
    # UTC基準。15分足の境目(:00,:15,:30,:45)の1分後に実行し、直前に確定した足をチェックする
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check USD/JPY 15m range and notify via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THRESHOLD_PIPS: "13"
        run: |
          set -e

          DATA=$(curl -s -H "User-Agent: Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/JPY=X?interval=15m&range=1d")
          COUNT=$(echo "$DATA" | jq '.chart.result[0].timestamp | length')
          IDX=$((COUNT - 2))

          if [ "$IDX" -lt 0 ]; then
            echo "not enough candle data yet"
            exit 0
          fi

          HIGH=$(echo "$DATA" | jq -r ".chart.result[0].indicators.quote[0].high[$IDX]")
          LOW=$(echo "$DATA" | jq -r ".chart.result[0].indicators.quote[0].low[$IDX]")
          CLOSE=$(echo "$DATA" | jq -r ".chart.result[0].indicators.quote[0].close[$IDX]")
          EPOCH=$(echo "$DATA" | jq -r ".chart.result[0].timestamp[$IDX]")

          if [ "$HIGH" = "null" ] || [ "$LOW" = "null" ]; then
            echo "no candle data (market closed?)"
            exit 0
          fi

          RANGE_PIPS=$(awk -v h="$HIGH" -v l="$LOW" 'BEGIN{printf "%.1f", (h-l)/0.01}')
          echo "closed 15m candle range: ${RANGE_PIPS} pips (threshold ${THRESHOLD_PIPS})"

          IS_OVER=$(awk -v r="$RANGE_PIPS" -v t="$THRESHOLD_PIPS" 'BEGIN{print (r>=t) ? "1" : "0"}')

          if [ "$IS_OVER" = "1" ]; then
            TIME_JST=$(TZ="Asia/Tokyo" date -d "@$EPOCH" "+%H:%M")
            MESSAGE="15分足(${TIME_JST}~)で ${RANGE_PIPS} pips動きました
          High: ${HIGH}
          Low: ${LOW}
          Close: ${CLOSE}"

            curl -s \
              -H "Title: USD/JPY ${RANGE_PIPS} pips Alert" \
              -H "Priority: high" \
              -H "Tags: chart_with_upwards_trend" \
              -H "Content-Type: text/plain; charset=utf-8" \
              --data-binary "$MESSAGE" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "alert sent"
          else
            echo "no alert"
          fi
